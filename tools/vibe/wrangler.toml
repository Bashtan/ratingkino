# Dev-only Worker that fills the vibe-search index (never deployed).
# tools/vibe/ingest.mjs drives it over http://127.0.0.1:8790 while it runs under
#   npx wrangler dev --config tools/vibe/wrangler.toml --port 8790            # findfilm-films
#   npx wrangler dev --config tools/vibe/wrangler.toml --port 8790 --env preview
# Both bindings are remote: Workers AI and the real Vectorize index on the
# account (wrangler's own login does the auth; no API token in any file).
name               = "findfilm-vibe-ingest"
main               = "worker.js"
compatibility_date = "2025-09-01"

[ai]
binding = "AI"
remote  = true

[[vectorize]]
binding    = "VECTORIZE"
index_name = "findfilm-films"
remote     = true

# /info reports it, and ingest.mjs names its progress log after it.
[vars]
INDEX_NAME = "findfilm-films"

[env.preview.ai]
binding = "AI"
remote  = true

[[env.preview.vectorize]]
binding    = "VECTORIZE"
index_name = "findfilm-films-preview"
remote     = true

[env.preview.vars]
INDEX_NAME = "findfilm-films-preview"
