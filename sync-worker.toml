# Cloudflare Worker — RatingKino Daily Sync
# Deployed separately from Pages via:  npx wrangler deploy --config sync-worker.toml --env=""
# (--env="" = the top level, production; [env.preview] below is for wrangler dev only)
#
# Cron fires at 00:00 UTC every day.
# Secrets (set once via CLI):
#   npx wrangler secret put TMDB_KEY --name ratingkino-sync
#   npx wrangler secret put OMDB_KEY --name ratingkino-sync

name              = "ratingkino-sync"
main              = "sync-worker.js"
compatibility_date = "2024-11-01"

[triggers]
# Three cron triggers — one per enrichment phase, 5 minutes apart.
# Phase 1 (00:00): fetch discover pages + enrich movies  0–39
# Phase 2 (00:05): enrich movies 40–79
# Phase 3 (00:10): enrich movies 80–118, merge & write final 'new-releases' key
# Trailer arcs (00:20): FF Bot's arc for each Trending / Top Rated title's trailer
# Vibe index (00:30): the new releases into vibe search's Vectorize index (syncVibeIndex)
crons = ["55 23 * * *", "0 0 * * *", "5 0 * * *", "10 0 * * *", "20 0 * * *", "30 0 * * *"]

[[kv_namespaces]]
binding = "MOVIES_CACHE"
id      = "9b1ddd3fe25446c390304fd3a460606e"

# Workers AI: the trailer arcs' model (syncTrailerArcs), and the vibe index's
# tags and embeddings (syncVibeIndex).
[ai]
binding = "AI"

# The vibe-search index /api/vibe-search reads (wrangler.toml binds the same one).
[[vectorize]]
binding    = "VECTORIZE"
index_name = "findfilm-films"

# Dev only, never deployed: the Worker against the preview index and the preview
# KV, to try a change to the nightly jobs without touching production:
#   npx wrangler dev --config sync-worker.toml --env preview --test-scheduled --port 8793
#   curl 'http://127.0.0.1:8793/sync-now?phase=vibe'
# (TMDB_KEY comes from the repo's .dev.vars.)
[[env.preview.kv_namespaces]]
binding = "MOVIES_CACHE"
id      = "c2367fa6be864a4c9e6e4a4f4d8d66c5"   # ratingkino-preview-cache
remote  = true

[env.preview.ai]
binding = "AI"
remote  = true

[[env.preview.vectorize]]
binding    = "VECTORIZE"
index_name = "findfilm-films-preview"
remote     = true
