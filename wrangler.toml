# Cloudflare Pages — FindFilm.ai (findfilm.ai)
# This file adds KV binding to Pages Functions (functions/api/[[path]].js).
# The same MOVIES_CACHE KV namespace is written by the sync Worker
# and read by the Pages Function at /api/cache/*.

name                   = "ratingkino"
# Was ".", i.e. "publish the entire repository". Pages offers no way to exclude
# files from an output directory — .gitignore does not apply to uploads, and
# .assetsignore is a Workers-static-assets feature that `pages deploy` ignores —
# so "." published sync-worker.js, schema.sql, this file, and /.dev.vars with the
# live TMDB_KEY and OMDB_KEY in it. dist/ is built by ./deploy.sh from an explicit
# allowlist and is gitignored. Never edit dist/ by hand; edit the source and restage.
pages_build_output_dir = "dist"
compatibility_date     = "2024-11-01"

[[kv_namespaces]]
binding = "MOVIES_CACHE"
id      = "9b1ddd3fe25446c390304fd3a460606e"

# D1 database for the "Movie Pitch" feature (shared voting + comments).
# Schema in schema.sql. Bound as DB in functions/api/[[path]].js.
[[d1_databases]]
binding       = "DB"
database_name = "findfilm-pitch"
database_id   = "261cc44d-36e9-4913-a1c9-b61e1aed949e"

[ai]
binding = "AI"

# Preview deployments (any --branch other than main) get their own KV and D1.
# Without this block Pages applies the top-level bindings above to previews too,
# so every preview URL could write to the production cache and Pitch database.
# kv_namespaces, d1_databases and ai are non-inheritable: once [env.preview]
# overrides one, all of them must be restated here or the deploy fails to validate.
# Preview D1 schema: npx wrangler d1 execute findfilm-pitch-preview --remote --file=schema.sql
[[env.preview.kv_namespaces]]
binding = "MOVIES_CACHE"
id      = "c2367fa6be864a4c9e6e4a4f4d8d66c5"   # ratingkino-preview-cache

[[env.preview.d1_databases]]
binding       = "DB"
database_name = "findfilm-pitch-preview"
database_id   = "ce6003b6-4584-43e0-8d0a-39669f6810ab"

[env.preview.ai]
binding = "AI"
